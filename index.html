<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字去重工具</title>
    <style>
        :root {
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --primary-color: #4a90e2;
            --text-color: #333;
            --border-color: #e1e4e8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        h2 {
            margin-top: 0;
            font-weight: 500;
            color: #2c3e50;
            text-align: center;
        }

        .textarea-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            resize: vertical;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        textarea:focus {
            border-color: var(--primary-color);
        }

        .controls {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: #357abd;
        }

        .btn-secondary {
            background-color: #f8f9fa;
            color: #666;
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background-color: #e9ecef;
        }

        .stats {
            font-size: 14px;
            color: #888;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>文字去重工具</h2>
    
    <div class="textarea-group">
        <div>
            <div class="stats" id="inputStats">字数: 0</div>
            <textarea id="inputText" placeholder="请在这里输入或粘贴需要去重的文字..."></textarea>
        </div>

        <div class="controls">
            <button class="btn-primary" onclick="handleRemoveDuplicates()">立即去重</button>
            <button class="btn-secondary" onclick="clearAll()">清空全部</button>
        </div>

        <div>
            <div class="stats" id="outputStats">字数: 0</div>
            <textarea id="outputText" placeholder="去重后的结果将显示在这里..." readonly></textarea>
        </div>
    </div>
</div>

<script>
    function handleRemoveDuplicates() {
        const input = document.getElementById('inputText').value;
        if (!input) return;

        // 将字符串转为数组，利用 Set 对象自动去重的特性
        // 这里会保留字符出现的先后顺序
        const uniqueChars = [...new Set(input.split(''))];
        
        const result = uniqueChars.join('');
        document.getElementById('outputText').value = result;
        
        updateStats();
    }

    function clearAll() {
        document.getElementById('inputText').value = '';
        document.getElementById('outputText').value = '';
        updateStats();
    }

    function updateStats() {
        const inputLen = document.getElementById('inputText').value.length;
        const outputLen = document.getElementById('outputText').value.length;
        
        document.getElementById('inputStats').innerText = `原字数: ${inputLen}`;
        document.getElementById('outputStats').innerText = `去重后字数: ${outputLen}`;
    }

    // 实时监控输入框字数
    document.getElementById('inputText').addEventListener('input', updateStats);
</script>

</body>
</html>
