<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字去重工具 - 修复版</title>
    <style>
        :root {
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --primary-color: #4a90e2;
            --text-color: #333;
            --border-color: #e1e4e8;
            --bg-image: none;
            --bg-opacity: 1; 
            --card-image: none;
            --card-opacity: 1; 
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 30px;
            box-sizing: border-box;
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            position: relative;
            z-index: 0;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-color);
            opacity: var(--bg-opacity);
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 30px 30px 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            position: relative;
            /* 关键修复：图片写在这里 */
            background-image: var(--card-image);
            background-size: cover;
            background-position: center;
            z-index: 1; /* 提升层级 */
        }

        .container::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--card-bg);
            opacity: var(--card-opacity);
            z-index: -1; /* 遮罩在文字下面，但在背景图上面 */
            border-radius: 12px;
        }

        h2 { margin-top: 0; color: #2c3e50; text-align: center; font-weight: 500; }
        .textarea-group { display: flex; flex-direction: column; gap: 15px; }
        textarea {
            width: 100%; height: 120px; padding: 12px; border: 1px solid var(--border-color);
            border-radius: 8px; font-size: 14px; resize: vertical; box-sizing: border-box;
            outline: none; background: rgba(255, 255, 255, 0.7); transition: border-color 0.3s;
        }
        textarea:focus { border-color: var(--primary-color); }
        .controls { display: flex; gap: 10px; margin: 20px 0; }
        button { flex: 1; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; transition: all 0.2s; }
        .btn-primary { background-color: var(--primary-color); color: white; }
        .btn-primary:hover { background-color: #357abd; }
        .btn-secondary { background-color: #f8f9fa; color: #666; border: 1px solid var(--border-color); }
        .stats { font-size: 13px; color: #666; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
        .copy-btn { background: #fff; border: 1px solid var(--border-color); padding: 4px 12px; border-radius: 14px; font-size: 12px; cursor: pointer; }

        .settings-wrapper { position: fixed; top: 20px; right: 20px; z-index: 100; }
        .settings-icon { width: 28px; height: 28px; cursor: pointer; fill: #000; } /* 确保图标是纯黑色 */
        .settings-panel {
            display: none; position: absolute; top: 40px; right: 0;
            width: 240px; background: white; padding: 20px; border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15); border: 1px solid #eee;
        }
        .settings-panel.active { display: block; }
        .setting-item { margin-bottom: 15px; }
        .setting-item label { display: block; margin-bottom: 8px; font-size: 13px; color: #444; }
        .setting-item input[type="range"] { width: 100%; cursor: pointer; }
    </style>
</head>
<body>

<div class="settings-wrapper">
    <svg class="settings-icon" onclick="toggleSettings()" viewBox="0 0 24 24">
        <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.85,9.48l2.03,1.58C4.84,11.36,4.81,11.69,4.81,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.5c-1.93,0-3.5-1.57-3.5-3.5 s1.57-3.5,3.5-3.5s3.5,1.57,3.5,3.5S13.93,15.5,12,15.5z"/>
    </svg>
    <div class="settings-panel" id="settingsPanel">
        <div class="setting-item">
            <label>背景图选择</label>
            <input type="file" accept="image/*" onchange="updateImage(this, '--bg-image')">
        </div>
        <div class="setting-item">
            <label>背景纯色遮罩 (1.0纯色 - 0.0全图)</label>
            <input type="range" min="0" max="1" step="0.1" value="1" oninput="updateStyle('--bg-opacity', this.value)">
        </div>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
        <div class="setting-item">
            <label>卡片图选择</label>
            <input type="file" accept="image/*" onchange="updateImage(this, '--card-image')">
        </div>
        <div class="setting-item">
            <label>卡片纯色遮罩 (1.0纯色 - 0.0全图)</label>
            <input type="range" min="0" max="1" step="0.1" value="1" oninput="updateStyle('--card-opacity', this.value)">
        </div>
    </div>
</div>

<div class="container">
    <h2>文字去重工具</h2>
    <div class="textarea-group">
        <div>
            <div class="stats" id="inputStats">
                <span>原字数: 0</span>
                <button class="copy-btn" id="copyInputBtn">复制原文</button>
            </div>
            <textarea id="inputText" placeholder="请在这里输入或粘贴需要去重的文字..."></textarea>
        </div>
        <div class="controls">
            <button class="btn-primary" onclick="handleRemoveDuplicates()">立即去重</button>
            <button class="btn-secondary" onclick="clearAll()">清空全部</button>
        </div>
        <div>
            <div class="stats" id="outputStats">
                <span>去重后字数: 0</span>
                <button class="copy-btn" id="copyOutputBtn">复制结果</button>
            </div>
            <textarea id="outputText" placeholder="去重后的结果将显示在这里..." readonly></textarea>
        </div>
    </div>
</div>

<script>
    function handleRemoveDuplicates() {
        const input = document.getElementById('inputText').value;
        if (!input) {
            document.getElementById('outputText').value = '';
            updateStats();
            return;
        }
        const result = [...new Set(input.split(''))].join('');
        document.getElementById('outputText').value = result;
        updateStats();
    }

    function clearAll() {
        document.getElementById('inputText').value = '';
        document.getElementById('outputText').value = '';
        updateStats();
    }

    function updateStats() {
        const inputLen = document.getElementById('inputText').value.length;
        const outputLen = document.getElementById('outputText').value.length;
        document.getElementById('inputStats').querySelector('span').innerText = `原字数: ${inputLen}`;
        document.getElementById('outputStats').querySelector('span').innerText = `去重后字数: ${outputLen}`;
    }

    async function copyToClipboard(elementId, btn) {
        const text = document.getElementById(elementId).value;
        if (!text) return;
        try {
            await navigator.clipboard.writeText(text);
            const originalText = btn.innerText;
            btn.innerText = '已复制！';
            setTimeout(() => { btn.innerText = originalText; }, 1500);
        } catch (err) {
            console.error('复制失败');
        }
    }

    document.getElementById('copyInputBtn').onclick = function() { copyToClipboard('inputText', this); };
    document.getElementById('copyOutputBtn').onclick = function() { copyToClipboard('outputText', this); };
    document.getElementById('inputText').oninput = updateStats;

    function toggleSettings() {
        document.getElementById('settingsPanel').classList.toggle('active');
    }

    function updateStyle(prop, val) {
        document.documentElement.style.setProperty(prop, val);
    }

    // 你要求的同步更新逻辑，全部保留在那，没动！
    function updateImage(input, prop) {
        const file = input.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                updateStyle(prop, `url('${e.target.result}')`);
                const opacityVar = prop === '--bg-image' ? '--bg-opacity' : '--card-opacity';
                updateStyle(opacityVar, 0.3);
                const sliders = document.querySelectorAll('input[type="range"]');
                const targetSlider = prop === '--bg-image' ? sliders[0] : sliders[1];
                targetSlider.value = 0.3;
            }
            reader.readAsDataURL(file);
        }
    }
</script>
</body>
</html>
