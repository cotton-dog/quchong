<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字去重工具</title>
    <style>
        :root {
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --primary-color: #4a90e2;
            --text-color: #333;
            --border-color: #e1e4e8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        h2 {
            margin-top: 0;
            font-weight: 500;
            color: #2c3e50;
            text-align: center;
        }

        .textarea-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            resize: vertical;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        textarea:focus {
            border-color: var(--primary-color);
        }

        .controls {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: #357abd;
        }

        .btn-secondary {
            background-color: #f8f9fa;
            color: #666;
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background-color: #e9ecef;
        }

        .copy-btn {
            background-color: #f0f2f5;
            color: #2c3e50;
            border: 1px solid var(--border-color);
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: normal;
            flex: 0 0 auto;
        }

        .copy-btn:hover {
            background-color: #e2e6ea;
            border-color: #bdc3c7;
        }

        .stats {
            font-size: 13px;
            color: #888;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>文字去重工具</h2>
    
    <div class="textarea-group">
        <div>
            <div class="stats" id="inputStats">
                <span>原字数: 0</span>
                <button class="copy-btn" id="copyInputBtn">复制原文</button>
            </div>
            <textarea id="inputText" placeholder="请在这里输入或粘贴需要去重的文字..."></textarea>
        </div>

        <div class="controls">
            <button class="btn-primary" onclick="handleRemoveDuplicates()">立即去重</button>
            <button class="btn-secondary" onclick="clearAll()">清空全部</button>
        </div>

        <div>
            <div class="stats" id="outputStats">
                <span>去重后字数: 0</span>
                <button class="copy-btn" id="copyOutputBtn">复制结果</button>
            </div>
            <textarea id="outputText" placeholder="去重后的结果将显示在这里..." readonly></textarea>
        </div>
    </div>
</div>

<script>
    function handleRemoveDuplicates() {
        const input = document.getElementById('inputText').value;
        if (!input) {
            document.getElementById('outputText').value = '';
            updateStats();
            return;
        }
        const uniqueChars = [...new Set(input.split(''))];
        const result = uniqueChars.join('');
        document.getElementById('outputText').value = result;
        updateStats();
    }

    function clearAll() {
        document.getElementById('inputText').value = '';
        document.getElementById('outputText').value = '';
        updateStats();
    }

    function updateStats() {
        const inputLen = document.getElementById('inputText').value.length;
        const outputLen = document.getElementById('outputText').value.length;
        
        document.getElementById('inputStats').innerHTML = `<span>原字数: ${inputLen}</span><button class="copy-btn" id="copyInputBtn">复制原文</button>`;
        document.getElementById('outputStats').innerHTML = `<span>去重后字数: ${outputLen}</span><button class="copy-btn" id="copyOutputBtn">复制结果</button>`;
        
        bindCopyEvents();
    }

    async function copyToClipboard(text, successMsg) {
        if (!text) {
            alert('没有内容可复制！');
            return;
        }
        try {
            await navigator.clipboard.writeText(text);
            alert(successMsg);
        } catch (err) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            alert(successMsg);
        }
    }

    function bindCopyEvents() {
        const copyInputBtn = document.getElementById('copyInputBtn');
        const copyOutputBtn = document.getElementById('copyOutputBtn');
        
        if (copyInputBtn) {
            const newCopyInput = copyInputBtn.cloneNode(true);
            copyInputBtn.parentNode.replaceChild(newCopyInput, copyInputBtn);
            newCopyInput.addEventListener('click', function() {
                const text = document.getElementById('inputText').value;
                copyToClipboard(text, '原文已复制到剪贴板');
            });
        }
        
        if (copyOutputBtn) {
            const newCopyOutput = copyOutputBtn.cloneNode(true);
            copyOutputBtn.parentNode.replaceChild(newCopyOutput, copyOutputBtn);
            newCopyOutput.addEventListener('click', function() {
                const text = document.getElementById('outputText').value;
                copyToClipboard(text, '去重结果已复制到剪贴板');
            });
        }
    }

    document.getElementById('inputText').addEventListener('input', updateStats);
    
    updateStats();
</script>

</body>
</html>
